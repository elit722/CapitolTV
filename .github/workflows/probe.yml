name: Sonde sources Minecraft
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Sources décompilées
        run: |
          gradle genSources --no-daemon -q || gradle genSourcesWithVineflower --no-daemon -q || true
          mkdir -p ../probe/mc
          for J in $(find ~/.gradle .gradle -name "*sources*.jar" 2>/dev/null | grep -i minecraft | grep -iv "fabric-api\|loader" ); do
            echo "$J" >> ../probe/mc/jars.txt
            unzip -l "$J" | awk '{print $4}' | grep -iE "tracy|ScreenshotRecorder|blaze3d/systems/(CommandEncoder|GpuDevice|RenderPass|RenderSystem)\.java|blaze3d/buffers/GpuBuffer|textures/GpuTexture\.java|client/gl/(Framebuffer|SimpleFramebuffer|RenderPipelines)\.java|opengl/GlCommandEncoder|GpuFence|blaze3d/opengl/GlStateManager" >> ../probe/mc/list.txt || true
            for f in $(unzip -l "$J" | awk '{print $4}' | grep -iE "client/sound/(SoundEngine|SoundSystem|SoundManager|AlUtil|Source|SoundListener)\.java"); do
              unzip -o -q "$J" "$f" -d ../probe/mc/src || true
            done
          done
          find ../probe/mc -type f | head -50
      - name: Publication
        working-directory: .
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add probe && git commit -m "sonde sources son [skip ci]" && git pull --rebase && git push

name: Mod caméra (Fabric 1.21.8)

on:
  push:
    branches: [main]
    paths: ["mod/**", ".github/workflows/mod.yml", "!dist/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compilation
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: capitoltv-cam
          path: mod/build/libs/capitoltv-cam-*.jar
          if-no-files-found: error
      - name: Démarrage d'un serveur 1.21.8 avec le mod
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nserver-port=25599\n' > run/server.properties
          (gradle runServer --no-daemon > server.log 2>&1 &)
          for i in $(seq 1 120); do
            if grep -q "Done (" server.log 2>/dev/null; then break; fi
            if grep -qE "Mixin apply failed|Exception in thread \"main\"|Could not execute entrypoint" server.log 2>/dev/null; then break; fi
            sleep 3
          done
          pkill -f "net.fabricmc" || true
          echo "----- extrait du journal -----"
          grep -iE "capitol|mixin|Done \(|ERROR|Exception" server.log | head -60
          grep -q "Done (" server.log
          ! grep -qiE "Mixin apply failed|capitoltv.*(error|exception)" server.log
          test -f run/config/capitoltv-server.json && cat run/config/capitoltv-server.json
      - name: Test client (vrai Minecraft + captures d'écran)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" gradle runClientGameTest --no-daemon --stacktrace > client.log 2>&1 || (tail -80 client.log; exit 1)
          grep -iE "capitol|error|exception" client.log | head -40
      - name: Publication du .jar dans dist/
        working-directory: .
        run: |
          mkdir -p dist
          cp mod/build/libs/capitoltv-cam-*.jar dist/capitoltv-cam.jar
          rm -f dist/capitoltv-cam-sources.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf dist/screens && mkdir -p dist/screens
          find mod -path "*screenshots*" -name "ctv-*.png" -exec cp {} dist/screens/ \; || true
          ls dist/screens || true
          git add -A dist
          git diff --cached --quiet || (git commit -m "Mod caméra : .jar compilé [skip ci]" && git pull --rebase -q && git push)
